services:
  luna:
    build: .
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
      - luna_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, pathlib; pathlib.Path('/app/data/luna_state.db').exists() or exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  luna_data:
